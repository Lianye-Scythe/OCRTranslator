name: Bug Report
description: 回報錯誤或相容性問題 / Report a bug, crash, or compatibility issue
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝你回報問題。請盡量附上重現步驟、畫面截圖、執行紀錄，以及`logs/` 中的 crash log（若有）。若內容包含 API Key、私有 Base URL 或未檢查的敏感日誌，請先自行移除或改走私下回報。
        Please include reproduction steps, screenshots, and reviewed log excerpts. Remove API keys, private URLs, and personal information before posting. Report security issues privately through https://github.com/Lianye-Scythe/OCRTranslator/security/advisories/new.
  - type: textarea
    id: summary
    attributes:
      label: 問題摘要 / Summary
      description: 簡單描述發生了什麼事 / Briefly describe what happened
      placeholder: 按下全域快捷鍵後程式關閉 / The app exits after pressing a global hotkey
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟 / Steps to reproduce
      description: 請列出可以穩定重現問題的步驟 / List the steps needed to reproduce the problem
      placeholder: |
        1. 開啟程式 / Open the app
        2. 選擇設定檔 / Select a profile
        3. 按下快捷鍵 / Press the hotkey
        4. 程式閃退 / The app crashes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果 / Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version or commit
      description: 填入應用版本或原始碼 commit / Enter the app version or source commit if known
      placeholder: v1.0.13 / main@<commit>
  - type: dropdown
    id: runtime
    attributes:
      label: 執行方式 / Runtime
      options:
        - 原始碼執行 / Source
        - 打包 exe / Packaged executable
        - 不確定 / Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境資訊 / Environment
      description: 系統、原始碼執行時的 Python 版本、螢幕與縮放 / OS, Python version for source runs, monitors, and display scaling
      placeholder: Windows 11 / Python 3.15 / 2 monitors / 150% scaling
  - type: textarea
    id: logs
    attributes:
      label: 日誌片段 / Log excerpts
      description: 只貼已檢查並移除敏感資料的片段 / Only paste reviewed excerpts with secrets and personal information removed
      render: text
