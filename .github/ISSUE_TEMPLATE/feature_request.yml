name: Feature Request
description: 提出功能或流程改進建議 / Suggest a feature or workflow improvement
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: 需求目標 / Problem to solve
      description: 你想解決什麼問題？ / What problem would this solve?
      placeholder: 希望浮窗記住位置 / Remember overlay positions between sessions
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案 / Proposed solution
      description: 如果你有具體想法，可以直接描述 / Describe your proposed approach, if any
  - type: textarea
    id: use_case
    attributes:
      label: 使用情境 / Use case
      description: 這個功能會在什麼情況下派上用場？ / When would this feature be useful?
      placeholder: 閱讀漫畫時經常移動浮窗 / Frequently moving overlays while reading manga
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影響範圍 / Area
      options:
        - UI / UX
        - OCR / 翻譯流程 / Translation
        - API / Provider
        - 架構與重構 / Architecture
        - 打包與發布 / Packaging and releases
        - 設定與資料保存 / Settings and persistence
        - 其他 / Other
