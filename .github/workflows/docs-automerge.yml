name: Documentation Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: docs-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-docs-automerge:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Reset previous auto-merge decision before rechecking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi

      - name: Checkout trusted base policy only
        if: '!github.event.pull_request.draft'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: tools/docs_policy.py
          sparse-checkout-cone-mode: false

      - name: Verify complete documentation-only diff
        if: '!github.event.pull_request.draft'
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/pr-files.json"
          python3 tools/docs_policy.py --pr-files "$RUNNER_TEMP/pr-files.json" --expected-count "$PR_CHANGED_FILES"

      - name: Enable merge after required checks pass
        if: steps.policy.outputs.docs_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
