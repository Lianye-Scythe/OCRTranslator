name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      preview_checks: ${{ steps.classify.outputs.preview_checks }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/docs_policy.py --base "$BASE_SHA"

  test:
    needs: changes
    runs-on: ${{ needs.changes.outputs.scope != 'full' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: needs.changes.outputs.scope != 'docs' || needs.changes.outputs.preview_checks == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install image-check dependency only
        if: needs.changes.outputs.preview_checks == 'true'
        run: python -m pip install --constraint constraints.txt Pillow

      - name: Check documentation links and images
        if: needs.changes.outputs.scope != 'full'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/docs_policy.py --base "$BASE_SHA" --check

      - name: Run preview-tool and CI policy tests
        if: needs.changes.outputs.scope == 'preview'
        run: python -m unittest tests.test_docs_policy tests.test_social_preview -v

      - name: Install application dependencies
        if: needs.changes.outputs.scope == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        if: needs.changes.outputs.scope == 'full'
        run: python -m unittest discover -v

      - name: Compile source files
        if: needs.changes.outputs.scope == 'full'
        run: python -m compileall app tests launcher.pyw

  windows-package:
    needs: [changes, test]
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Build unsigned Windows package
        shell: cmd
        env:
          BUILD_NO_PAUSE: "1"
        run: build_exe.bat

  ci-required:
    if: always()
    needs: [changes, test, windows-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce the selected CI path
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_SCOPE: ${{ needs.changes.outputs.scope }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.windows-package.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$TEST_RESULT" = success
          case "$CI_SCOPE" in
            docs|preview) test "$PACKAGE_RESULT" = skipped ;;
            full) test "$PACKAGE_RESULT" = success ;;
            *) exit 1 ;;
          esac
